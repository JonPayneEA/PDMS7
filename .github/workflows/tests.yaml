# Light checks for an experimental package: the test suite on one platform, on each pull
# request. No R CMD check, articles, coverage or lint; the full checks run by hand
# (full-checks.yaml).
name: tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check
      - name: Tests
        run: testthat::test_local(stop_on_failure = TRUE, reporter = "summary")
        shell: Rscript {0}
